<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - OemahDesainWeb</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* CSS GLOBAL */
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .box { background: #111827; padding: 24px; border-radius: 10px; width: 100%; max-width: 900px; } /* Lebar max diperbesar biar grafik lega */
    
    h2 { margin-top: 0; color: #60a5fa; }
    h3 { border-bottom: 1px solid #374151; padding-bottom: 10px; margin-top: 30px; color: #e5e7eb; }
    
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #22c55e; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { opacity: 0.9; }
    .logout { background: #ef4444; margin-top: 30px; }
    .hidden { display: none; }
    
    /* TABEL */
    .table-container { overflow-x: auto; margin-top: 10px; border: 1px solid #374151; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; color: #ddd; }
    th, td { padding: 12px; border-bottom: 1px solid #374151; text-align: left; font-size: 14px; }
    th { background-color: #1f2937; color: #9ca3af; text-transform: uppercase; font-size: 12px; }
    tr:hover { background-color: #1f2937; }
    
    .refresh-btn { background: #3b82f6; width: auto; display: inline-block; padding: 8px 16px; font-size: 14px; margin-bottom: 10px; float: right;}

    /* STYLE KHUSUS IFRAME LOOKER STUDIO */
    .looker-container {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #fff; /* Latar putih biar grafik jelas */
        margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div id="loginBox">
      <h2 style="text-align:center;">🔐 Admin Login</h2>
      <input type="email" id="email" placeholder="Email admin">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Masuk Dashboard</button>
      <p id="loginMsg" style="text-align:center; margin-top:10px; font-size:14px;"></p>
    </div>

    <div id="dashboard" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">📊 Executive Dashboard</h2>
        <button class="refresh-btn" onclick="loadVisitors()">🔄 Refresh Data</button>
      </div>

      <h3>📈 Visualisasi Traffic (Looker Studio)</h3>
      <div class="looker-container">
        <iframe 
            src="https://lookerstudio.google.com/embed/reporting/743d24e0-d502-44c5-8fab-2ef861a3608b/page/4iQmF" 
            width="100%" 
            height="500" 
            frameborder="0" 
            style="border:0" 
            allowfullscreen 
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
      </div>

      <h3>🕵️ Log Pengunjung Terakhir</h3>
      <p style="color: #9ca3af; font-size: 14px;">Data realtime 50 pengunjung terakhir (IP & Perangkat).</p>

      <div class="table-container">
        <table id="visitorTable">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>IP Address</th>
              <th>Perangkat</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3" style="text-align:center;">Klik Refresh untuk memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <button class="logout" id="logoutBtn">Logout Admin</button>
    </div>
  </div>

  <script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://tosjjicxibibuxpskpjz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvc2pqaWN4aWJpYnV4cHNrcGp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxODAxMTAsImV4cCI6MjA4NDc1NjExMH0.-wAYdccN8Ji6tVWhXYQrhJunDeyA7cpzskkmpY3MLT0';
    
    // Inisialisasi
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Ambil Elemen HTML
    const loginBox = document.getElementById('loginBox');
    const dashboard = document.getElementById('dashboard');
    const msg = document.getElementById('loginMsg');
    const tableBody = document.querySelector('#visitorTable tbody');

    // 1. CEK SESSION
    sb.auth.getSession().then(({ data }) => {
      if (data.session) showDashboard();
    });

    // 2. LOGIN
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if(!email || !password) {
        msg.textContent = '⚠️ Email dan Password harus diisi!';
        msg.style.color = 'orange';
        return;
      }

      msg.textContent = '⏳ Sedang memproses...';
      msg.style.color = 'yellow';

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = '❌ Gagal: ' + error.message;
        msg.style.color = '#ef4444';
        return;
      }
      showDashboard();
    });

    // 3. LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      location.reload();
    });

    // 4. UI HANDLER
    function showDashboard() {
      loginBox.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadVisitors();
    }

    // 5. LOAD DATA TABEL
    async function loadVisitors() {
      tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">🔄 Mengambil data terbaru...</td></tr>';

      const { data, error } = await sb
        .from('visitors')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) {
        alert('Gagal ambil data: ' + error.message);
        return;
      }

      tableBody.innerHTML = ''; 

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada visitor masuk.</td></tr>';
        return;
      }

      data.forEach(visitor => {
        const waktu = new Date(visitor.created_at).toLocaleString('id-ID');
        let device = visitor.device_info || '-';
        
        if(device.includes('Android')) device = '📱 Android';
        else if(device.includes('iPhone')) device = '📱 iPhone';
        else if(device.includes('Windows')) device = '💻 Windows';
        else if(device.includes('Macintosh')) device = '💻 Mac';
        else device = '🌐 ' + device.substring(0, 15) + '...';

        const row = `
          <tr>
            <td style="font-size:12px;">${waktu}</td>
            <td style="font-weight:bold; color:#4ade80;">${visitor.ip_address}</td>
            <td style="font-size:12px; color:#9ca3af;">${device}</td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    window.loadVisitors = loadVisitors;
  </script>

</body>
</html>
