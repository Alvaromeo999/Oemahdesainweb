<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo UMKM Lokal - Oemah Desain</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fafafa; margin: 0; }
        header { background: #8e44ad; color: white; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .item { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding-bottom: 10px; }
        .item img { width: 100%; height: 150px; object-fit: cover; }
        .item h4 { margin: 10px; font-size: 0.9rem; }
        .item .price { margin: 0 10px; color: #8e44ad; font-weight: bold; }
        .btn-buy { display: block; margin: 10px; background: #25d366; color: white; text-align: center; padding: 5px; border-radius: 4px; text-decoration: none; font-size: 0.8rem; }
        .demo-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 10px; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <h2>Keripik "Mak Nyuss"</h2>
        <p>Oleh-oleh Khas Asli</p>
    </header>
    <div class="grid">
        <div class="item">
            <img src="https://images.unsplash.com/photo-1566478989037-eec170784d0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Keripik">
            <h4>Keripik Pedas Level 5</h4>
            <div class="price">Rp 15.000</div>
            <a href="#" class="btn-buy">Pesan WA</a>
        </div>
        <div class="item">
            <img src="https://images.unsplash.com/photo-1623341214825-9f4f963727da?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Basreng">
            <h4>Basreng Gurih</h4>
            <div class="price">Rp 12.000</div>
            <a href="#" class="btn-buy">Pesan WA</a>
        </div>
    </div>
    <div class="demo-bar">Demo Website UMKM Sederhana.</div>
</body>
</html>
