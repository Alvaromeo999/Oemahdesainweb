<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - OemahDesainWeb</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* STYLE ADMIN */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .box { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 1000px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    h2 { margin-top: 0; color: #60a5fa; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    h3 { margin-top: 30px; color: #94a3b8; font-size: 1.1rem; }
    
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
    input { background: #334155; color: white; border: 1px solid #475569; }
    input:focus { outline: 2px solid #60a5fa; }
    
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .logout { background: #ef4444; margin-top: 40px; }
    .logout:hover { background: #dc2626; }
    
    .hidden { display: none; }
    
    /* STYLE IFRAME (GRAFIK) */
    .looker-wrapper {
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 75%; /* Rasio Aspek 4:3 */
        border: 1px solid #475569;
        border-radius: 8px;
        overflow: hidden;
        background: white;
    }
    .looker-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    /* STYLE TABEL */
    .table-responsive { overflow-x: auto; margin-top: 10px; border: 1px solid #334155; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    td { font-size: 0.9rem; }
    tr:hover { background: #334155; }
    
    /* STATUS */
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-android { background: #065f46; color: #34d399; }
    .badge-iphone { background: #3730a3; color: #818cf8; }
    .badge-pc { background: #1e40af; color: #60a5fa; }
  </style>
</head>

<body>

  <div class="box">
    <div id="loginBox">
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="border:none;">🔐 Admin Access</h2>
        <p style="color: #94a3b8;">Masukkan kredensial untuk memantau traffic.</p>
      </div>
      <input type="email" id="email" placeholder="Email Admin">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Masuk Dashboard</button>
      <p id="loginMsg" style="text-align:center; margin-top:15px; font-size:14px; color: #ef4444;"></p>
    </div>

    <div id="dashboard" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>📊 Executive Monitor</h2>
        <button onclick="loadVisitors()" style="width: auto; padding: 8px 15px; background: #059669;">🔄 Refresh</button>
      </div>

      <h3>📈 Visualisasi Data</h3>
      <div class="looker-wrapper">
        <iframe 
            src="https://lookerstudio.google.com/embed/reporting/743d24e0-d502-44c5-8fab-2ef861a3608b/page/4iQmF" 
            frameborder="0" 
            style="border:0" 
            allowfullscreen 
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
        </iframe>
      </div>

      <h3>🕵️ Log Pengunjung (Real-time)</h3>
      <div class="table-responsive">
        <table id="visitorTable">
          <thead>
            <tr>
              <th>Waktu Masuk</th>
              <th>IP Address</th>
              <th>Perangkat</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <button class="logout" id="logoutBtn">Keluar / Logout</button>
    </div>
  </div>

  <script>
    // KONFIGURASI SUPABASE
    const SB_URL = 'https://tosjjicxibibuxpskpjz.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvc2pqaWN4aWJpYnV4cHNrcGp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkxODAxMTAsImV4cCI6MjA4NDc1NjExMH0.-wAYdccN8Ji6tVWhXYQrhJunDeyA7cpzskkmpY3MLT0';
    
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const loginBox = document.getElementById('loginBox');
    const dashboard = document.getElementById('dashboard');
    const tableBody = document.querySelector('#visitorTable tbody');
    const msg = document.getElementById('loginMsg');

    // CEK SESSION SAAT LOAD
    sb.auth.getSession().then(({ data }) => {
      if (data.session) showDashboard();
    });

    // FUNGSI LOGIN
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      
      msg.innerText = "Memproses...";
      const { error } = await sb.auth.signInWithPassword({ email, password });
      
      if (error) {
        msg.innerText = "❌ Login Gagal: " + error.message;
      } else {
        showDashboard();
      }
    });

    // FUNGSI LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      location.reload();
    });

    // TAMPILKAN DASHBOARD
    function showDashboard() {
      loginBox.classList.add('hidden');
      dashboard.classList.remove('hidden');
      loadVisitors();
    }

    // AMBIL DATA VISITOR
    async function loadVisitors() {
      tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">🔄 Mengambil data terbaru...</td></tr>';
      
      const { data, error } = await sb
        .from('visitors')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error || !data) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">Gagal ambil data.</td></tr>';
        return;
      }

      tableBody.innerHTML = '';
      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada pengunjung.</td></tr>';
        return;
      }

      data.forEach(v => {
        const waktu = new Date(v.created_at).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
        
        let deviceLabel = '<span class="badge badge-pc">Desktop</span>';
        if (v.device_info.includes('Android')) deviceLabel = '<span class="badge badge-android">Android</span>';
        if (v.device_info.includes('iPhone')) deviceLabel = '<span class="badge badge-iphone">iPhone</span>';

        const row = `
          <tr>
            <td>${waktu}</td>
            <td style="font-family:monospace; color:#34d399;">${v.ip_address}</td>
            <td>${deviceLabel} <br><span style="font-size:10px; color:#64748b;">${v.device_info.substring(0,25)}...</span></td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }
  </script>

</body>
</html>
