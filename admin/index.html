<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - OemahDesainWeb</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    .box { background: #111827; padding: 24px; border-radius: 10px; max-width: 800px; margin: 0 auto; } /* Lebar diperbesar untuk tabel */
    
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; }
    button { background: #22c55e; color: white; font-weight: bold; cursor: pointer; }
    .logout { background: #ef4444; margin-top: 20px; }
    .hidden { display: none; }
    
    /* STYLE TABEL DATA */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #ddd; }
    th, td { padding: 10px; border-bottom: 1px solid #374151; text-align: left; font-size: 14px; }
    th { background-color: #1f2937; }
    tr:hover { background-color: #1f2937; }
    .refresh-btn { background: #3b82f6; width: auto; display: inline-block; padding: 8px 16px; font-size: 14px; margin-bottom: 10px;}
  </style>
</head>

<body>

  <div class="box">
    <div id="loginBox">
      <h2>🔐 Admin Login</h2>
      <input type="email" id="email" placeholder="Email admin">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginMsg"></p>
    </div>

    <div id="dashboard" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>📊 Data Visitor Real-time</h2>
        <button class="refresh-btn" onclick="loadVisitors()">🔄 Refresh Data</button>
      </div>
      
      <p>Memantau trafik IP & Perangkat dari Iklan.</p>

      <div style="overflow-x:auto;">
        <table id="visitorTable">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>IP Address</th>
              <th>Perangkat</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3">Sedang memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <button class="logout" id="logoutBtn">Logout Admin</button>
    </div>
  </div>

  <script src="admin.js"></script>

</body>
</html>
