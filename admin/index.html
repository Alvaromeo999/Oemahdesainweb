  <meta charset="UTF-8">
  <title>Admin Panel - OemahDesainWeb</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #111827;
      padding: 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 360px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #22c55e;
      cursor: pointer;
      font-weight: bold;
    }
    .logout {
      background: #ef4444;
      margin-top: 20px;
    }
    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="box">
    <!-- LOGIN -->
    <div id="loginBox">
      <h2>🔐 Admin Login</h2>
      <input type="email" id="email" placeholder="Email admin">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginMsg"></p>
    </div>

          <a href="#"
             class="btn-wa"
             data-wa="Halo Oemah Desain Web, saya tertarik jasa pembuatan website"
             data-source="hero">
             💬 Konsultasi WhatsApp
          </a>


    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <h2>✅ Admin Aktif</h2>
      <p>Kamu sudah login sebagai admin.</p>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
