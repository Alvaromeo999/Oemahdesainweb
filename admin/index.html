  <!-- =========================
       STYLE
  ========================= -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #111827;
      padding: 24px;
      border-radius: 10px;
      width: 100%;
      max-width: 360px;
    }
    input, button, a.btn-wa {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    button {
      background: #22c55e;
      cursor: pointer;
      font-weight: bold;
    }
    .logout {
      background: #ef4444;
    }
    .btn-wa {
      background: #25D366;
      color: #000;
      font-weight: bold;
    }
    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <!-- LOGIN -->
    <div id="loginBox">
      <h2>🔐 Admin Login</h2>
      <input type="email" id="email" placeholder="Email admin">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginMsg"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
      <h2>✅ Admin Aktif</h2>
      <p>Kamu sudah login sebagai admin.</p>

      <!-- OPTIONAL: WA BUTTON (tracking aktif) -->
      <a href="#"
         class="btn-wa"
         data-wa="Halo Oemah Desain Web, saya tertarik jasa pembuatan website"
         data-source="admin_panel">
         💬 WhatsApp OemahDesainWeb
      </a>

      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <!-- =========================
       ADMIN SCRIPT
  ========================= -->
  <script src="admin.js"></script>

  <!-- =========================
       WHATSAPP TRACKING (GA4 + META)
  ========================= -->
  <script>
  (function initWATracking() {
    const buttons = document.querySelectorAll('[data-wa]');
    if (!buttons.length) return;

    const WA_NUMBER = '628121515633';

    buttons.forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();

        const message = btn.dataset.wa || '';
        const source = btn.dataset.source || 'unknown';

        /* GA4 EVENT */
        if (typeof gtag === 'function') {
          gtag('event', 'click_whatsapp', {
            event_category: 'engagement',
            event_label: source
          });
        }

        /* META EVENT */
        if (typeof fbq === 'function') {
          fbq('trackCustom', 'ClickWhatsApp', {
            source: source
          });
        }

        const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      });
    });
  })();
  </script>

</body>
</html>
